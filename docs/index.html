<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a1f1f">
  <meta name="description" content="Convert between decimal and Roman numerals – works offline">
  <title>Arab2Roman Converter</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/Arab2RomanConverter-icon-152.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Arab2Roman converter</h1></header>
  <main>
    <form onsubmit="return false">
      <label for="decimal">Decimal number</label>
      <input id="decimal" type="number" inputmode="numeric" min="1" max="3999" placeholder="e.g. 2026">
      <label for="roman">Roman numeral</label>
      <input id="roman" type="text" autocapitalize="characters" autocomplete="off" placeholder="e.g. MMXXVI">
      <p id="message" class="message" role="status"></p>
    </form>
    <section>
      <h2>Latest conversions <button id="clear" type="button">Clear</button></h2>
      <ol id="history"></ol>
    </section>
  </main>
  <footer>© dipina · DASW Unit 5 · Works offline</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
